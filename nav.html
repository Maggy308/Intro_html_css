<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
   @import url('https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Notable&family=Yarndings+12&display=swap');
        body{
           font-family: "Domine", serif;
             font-weight: 400;
             font-style: normal;
             margin: 0;

  
        }
        nav{
            display: flex;
            justify-content: center; 
            /* background: blueviolet; */
            border-bottom: 1px solid rgb(34, 18, 18);

        }
        .content{
            /* background-color: cadetblue; */
            width: 80%;
            display: flex;
            justify-content: space-between;
            align-items: center;
         }
        .logo img{
            width: 50px;
            height: 50px;
         }
         .content ul{
            display: flex;
            /* remove bullets */
           list-style-type: none;
        }
        .content li{
            margin-left: 16px;
            margin-right: 16px;
        }
        .content a{
            text-decoration: none;
            color: #0a0a0a;
            padding: 8px 16px;
            text-transform: uppercase;
        }
        .content a:hover{
            color: #363333;
            /* background-color: #0a0a0a; */
            border-bottom: 2px solid #9a1515;
        }
    </style>

</head>


<body>
    <nav>
        <div class="content">
            <div class="logo">
                <img src="images/icons8-lorry-48.png" alt="logo">
            </div>
            <ul>
                <li><a href="#">home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Get Help</a></li>
                <li><a href="#">Team</a></li>
                
            </ul>

        </div>
    </nav>
    
</body>
</html>
