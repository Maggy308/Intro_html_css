<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap-Intro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .text-success{
            color:rgb(7, 32, 218) !important;
        }
    </style>
</head>
<body>
    <!-- <h1 class="text-center text-danger">Lorem, ipsum dolor sit amet consectetur adipisicing elit. In impedit distinctio cupiditate error aperiam dolorum quibusdam suscipit amet aliquam similique atque adipisci mollitia commodi, consequuntur libero, nihil alias esse neque?</h1> -->

    <table class="table table-dark table-striped table-hover table border ">
       <tr>
        <th>First Name</th>
        <th>Last name</th>
        <th>Age</th>
       </tr>
       <tr>
        <td>Maggy</td>
        <td>Kibui</td>
        <td>12</td>
       </tr>
       <tr>
        <td>Mary</td>
        <td>Young</td>
        <td>34</td>
       </tr>
       <tr>
        <td>Lucy</td>
        <td>Njeri</td>
        <td>12</td>
       </tr>
    </table>
    <div id="demo" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicators/dots -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>

  <!-- The slideshow/carousel -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="images/clay-banks-MF-P392MB7s-unsplash.jpg" alt="clay-banks" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="images/icons8-lorry-48.png" alt="lorry" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="images/my love.png" alt="New love" class="d-block w-100">
    </div>
  </div>

  <!-- Left and right controls/icons -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
</body>
</html>
